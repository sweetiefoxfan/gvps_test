<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gustavvasas Pluggsida</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">Gustavvasas Pluggsida</h1>
            <div class="nav-controls">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="customize-btn" class="customize-btn" aria-label="Customize">
                    <i class="fas fa-palette"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="hero">
        <div class="hero-content">
            <h2>Play Awesome Open-Source Games</h2>
            <p>Discover and play fun HTML5 games from GitHub</p>
            <input type="text" id="game-search" placeholder="Search games..." class="search-input">
            <button id="search-btn" class="search-btn">Search</button>
        </div>
    </header>

    <!-- Game Categories -->
    <section class="categories">
        <div class="category-tabs">
            <button class="tab-btn active" data-category="all">All Games</button>
            <button class="tab-btn" data-category="puzzle">Puzzle</button>
            <button class="tab-btn" data-category="arcade">Arcade</button>
            <button class="tab-btn" data-category="strategy">Strategy</button>
            <button class="tab-btn" data-category="multiplayer">Multiplayer</button>
        </div>
    </section>

    <!-- Games Grid -->
    <main class="games-container">
        <div class="games-grid" id="games-grid">
            <!-- Games will be populated here by JavaScript -->
        </div>
    </main>

    <!-- Customization Panel (hidden by default) -->
    <div id="customize-panel" class="customize-panel">
        <div class="customize-header">
            <h3>Customize Your Experience</h3>
            <button id="close-customize" class="close-btn">&times;</button>
        </div>
        <div class="customize-content">
            <div custom-section>
                <h4>Theme</h4>
                <div class="theme-options">
                    <button class="theme-option active" data-theme="dark">Dark</button>
                    <button class="theme-option" data-theme="light">Light</button>
                    <button class="theme-option" data-theme="neon">Neon</button>
                    <button class="theme-option" data-theme="retro">Retro</button>
                </div>
            </div>

            <div custom-section>
                <h4>Layout</h4>
                <div class="layout-options">
                    <label>
                        <input type="radio" name="layout" value="grid" checked>
                        Grid View
                    </label>
                    <label>
                        <input type="radio" name="layout" value="list">
                        List View
                    </label>
                </div>
            </div>

            <div custom-section>
                <h4>Game Size</h4>
                <div class="size-options">
                    <button class="size-option active" data-size="small">Small</button>
                    <button class="size-option" data-size="medium">Medium</button>
                    <button class="size-option" data-size="large">Large</button>
                </div>
            </div>

            <div custom-section>
                <h4>Background</h4>
                <div class="bg-options">
                    <button class="bg-option active" data-bg="gradient">Gradient</button>
                    <button class="bg-option" data-bg="dark">Dark</button>
                    <button class="bg-option" data-bg="space">Space</button>
                    <button class="bg-option" data-bg="abstract">Abstract</button>
                </div>
            </div>
        </div>
        <div class="customize-footer">
            <button id="apply-customize" class="apply-btn">Apply Changes</button>
        </div>
    </div>

    <!-- Game Modal (for detailed view) -->
    <div id="game-modal" class="game-modal">
        <div class="game-modal-content">
            <span class="close-modal">&times;</span>
            <div class="game-modal-header">
                <h3 id="modal-game-title"></h3>
            </div>
            <div class="game-modal-body">
                <iframe id="modal-game-frame" sandbox="allow-scripts allow-same-origin"></iframe>
                <div class="game-info" id="modal-game-info">
                    <p id="modal-game-description"></p>
                    <div class="game-tags" id="modal-game-tags"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/games-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
